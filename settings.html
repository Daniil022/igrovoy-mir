<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚙️ Настройки — Шахтёр-Мир</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <header class="h">
        <div class="h-res">
            <span class="badge coin">🪙 <b id="coins">100</b></span>
        </div>
        <div class="h-lvl">⭐ <b id="level">1</b></div>
    </header>

    <nav class="tabs">
        <a href="index.html" class="tab-btn">⛏ Шахта</a>
        <a href="settings.html" class="tab-btn active">⚙️</a>
    </nav>

    <main class="main">
        <h2>⚙️ Настройки</h2>
        
        <div class="card" style="margin-bottom:0.5rem;">
            <h3>👤 Никнейм</h3>
            <input id="nick-input" style="width:100%;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);margin:0.5rem 0;" placeholder="Введи никнейм">
            <button id="save-nick" class="btn btn-sell" style="width:100%;">Сохранить</button>
        </div>

        <div class="card" style="margin-bottom:0.5rem;">
            <h3>🌙 Тема</h3>
            <button id="toggle-theme" class="btn btn-boost" style="width:100%;">Переключить тему</button>
        </div>

        <div class="card" style="margin-bottom:0.5rem;">
            <h3>💾 Сохранение</h3>
            <button id="export-save" class="btn btn-sell" style="width:100%;margin-bottom:0.3rem;">📤 Экспорт сохранения</button>
            <button id="import-save" class="btn btn-boost" style="width:100%;margin-bottom:0.3rem;">📥 Импорт сохранения</button>
            <input type="file" id="import-file" accept=".json" style="display:none;">
        </div>

        <div class="card" style="margin-bottom:0.5rem;border-color:var(--red);">
            <h3 style="color:var(--red);">⚠ Опасная зона</h3>
            <button id="reset-game" class="btn" style="width:100%;background:var(--red);color:#fff;">🗑 Сбросить весь прогресс</button>
        </div>
    </main>
</div>

<div id="toast" class="toast hidden">
    <span id="toast-icon"></span>
    <div><strong id="toast-title"></strong><p id="toast-text"></p></div>
</div>

<script src="script.js"></script>
<script>
document.getElementById('coins').textContent = fmt(G.coins);
document.getElementById('level').textContent = G.level;

document.getElementById('nick-input').value = localStorage.getItem('shahter-mir-nick') || '';

document.getElementById('save-nick').addEventListener('click', () => {
    const nick = document.getElementById('nick-input').value.trim() || 'Шахтёр';
    localStorage.setItem('shahter-mir-nick', nick);
    showToast('✅','Сохранено!','Твой ник: ' + nick);
});

document.getElementById('toggle-theme').addEventListener('click', () => {
    document.body.classList.toggle('light');
    G.theme = document.body.classList.contains('light') ? 'light' : 'dark';
    saveGame();
});

if (G.theme === 'light') document.body.classList.add('light');

document.getElementById('export-save').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(G, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shahter-mir-save-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    showToast('📤','Экспортировано!','Сохранение скачано');
});

document.getElementById('import-save').addEventListener('click', () => {
    document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            const data = JSON.parse(ev.target.result);
            if (confirm('Заменить текущий прогресс загруженным сохранением?')) {
                Object.assign(G, data);
                saveGame();
                location.reload();
            }
        } catch(err) {
            showToast('❌','Ошибка!','Неверный формат файла');
        }
    };
    reader.readAsText(file);
});

document.getElementById('reset-game').addEventListener('click', () => {
    if (confirm('ТОЧНО сбросить ВЕСЬ прогресс? Это необратимо!')) {
        if (confirm('Последнее предупреждение! Сбросить?')) {
            localStorage.removeItem('shahter-mir');
            localStorage.removeItem('shahter-mir-chat');
            localStorage.removeItem('shahter-mir-trades');
            localStorage.removeItem('shahter-mir-refs');
            localStorage.removeItem('shahter-mir-all-refs');
            localStorage.removeItem('shahter-mir-wins');
            location.reload();
        }
    }
});
</script>
</body>
</html>
