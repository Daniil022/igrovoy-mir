<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>📦 Кейсы — Шахтёр-Мир</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <header class="h">
        <div class="h-res">
            <span class="badge coin">🪙 <b id="coins">100</b></span>
            <span class="badge dia">💎 <b id="diamonds">0</b></span>
        </div>
        <div class="h-lvl">⭐ <b id="level">1</b></div>
    </header>

    <nav class="tabs">
        <a href="index.html" class="tab-btn">⛏ Шахта</a>
        <a href="miners.html" class="tab-btn">👷 Бригада</a>
        <a href="shop.html" class="tab-btn">🛒 Магазин</a>
        <a href="oil.html" class="tab-btn">🛢 Нефть</a>
        <a href="cases.html" class="tab-btn active">📦 Кейсы</a>
        <a href="achievements.html" class="tab-btn">🏆</a>
    </nav>

    <main class="main">
        <h2>📦 Кейсы</h2>
        <p style="color:var(--text2);">Открыто: <b id="cases-opened">0</b></p>
        <div class="grid" id="cases-grid"></div>
    </main>
</div>

<div id="case-modal" class="modal hidden">
    <div class="modal-box">
        <h2>📦 Открытие!</h2>
        <div id="case-loot" style="font-size:3rem;margin:1rem 0;"></div>
        <div id="case-text"></div>
        <button id="case-close">🎁 Забрать</button>
    </div>
</div>

<div id="toast" class="toast hidden">
    <span id="toast-icon"></span>
    <div><strong id="toast-title"></strong><p id="toast-text"></p></div>
</div>

<script src="script.js"></script>
<script>
function renderCases() {
    document.getElementById('coins').textContent = fmt(G.coins);
    document.getElementById('diamonds').textContent = fmt(G.diamonds);
    document.getElementById('level').textContent = G.level;
    document.getElementById('cases-opened').textContent = G.stats.casesOpened;
    
    document.getElementById('cases-grid').innerHTML = CASE_DATA.map(c => `
        <div class="card" style="border-color:${c.color};">
            <div class="icon">${c.icon}</div>
            <div class="name" style="color:${c.color};">${c.name}</div>
            <div class="desc">${c.desc}</div>
            <div class="price">🪙 ${fmt(c.cost)}</div>
            <button onclick="openCase('${c.id}')" ${G.coins<c.cost?'disabled':''}>Открыть</button>
        </div>
    `).join('');
}

function openCase(type) {
    const caseData = CASE_DATA.find(c => c.id === type);
    if (!caseData || G.coins < caseData.cost) return;
    
    G.coins -= caseData.cost;
    G.stats.casesOpened++;
    
    const roll = Math.random();
    let loot = { icon:'🪨', text:'Ничего...', amount:0, key:'stone' };
    
    if (type === 'common') {
        if (roll < 0.5) loot = { icon:'🪨', text:'50 камня', amount:50, key:'stone' };
        else if (roll < 0.8) loot = { icon:'🔩', text:'20 железа', amount:20, key:'iron' };
        else if (roll < 0.95) loot = { icon:'🥇', text:'10 золота', amount:10, key:'gold' };
        else loot = { icon:'💎', text:'3 алмаза!', amount:3, key:'diamond' };
    } else if (type === 'rare') {
        if (roll < 0.3) loot = { icon:'🔩', text:'40 железа', amount:40, key:'iron' };
        else if (roll < 0.6) loot = { icon:'🥇', text:'20 золота', amount:20, key:'gold' };
        else if (roll < 0.85) loot = { icon:'💎', text:'8 алмазов!', amount:8, key:'diamond' };
        else if (roll < 0.95) loot = { icon:'💠', text:'3 кристалла!', amount:3, key:'crystal' };
        else loot = { icon:'🪙', text:'300 монет!', amount:300, key:'coins' };
    } else if (type === 'epic') {
        if (roll < 0.3) loot = { icon:'💎', text:'15 алмазов!', amount:15, key:'diamond' };
        else if (roll < 0.6) loot = { icon:'💠', text:'8 кристаллов!', amount:8, key:'crystal' };
        else if (roll < 0.8) loot = { icon:'⚡', text:'5 энергита!', amount:5, key:'energite' };
        else if (roll < 0.93) loot = { icon:'🪙', text:'800 монет!', amount:800, key:'coins' };
        else loot = { icon:'🧰', text:'Кирка +1 ур!', amount:1, key:'pickaxe' };
    } else if (type === 'legendary') {
        if (roll < 0.4) loot = { icon:'⚡', text:'10 энергита!', amount:10, key:'energite' };
        else if (roll < 0.7) loot = { icon:'🌟', text:'5 мифрила!', amount:5, key:'mithril' };
        else if (roll < 0.85) loot = { icon:'☢', text:'2 урана!', amount:2, key:'uranium' };
        else if (roll < 0.95) loot = { icon:'🪙', text:'3000 монет!', amount:3000, key:'coins' };
        else loot = { icon:'👑', text:'Бог-шахтёр!', amount:1, key:'god_miner' };
    } else if (type === 'oil') {
        if (roll < 0.5) loot = { icon:'🛢', text:'30 нефти', amount:30, key:'oil' };
        else if (roll < 0.8) loot = { icon:'🛢', text:'80 нефти!', amount:80, key:'oil' };
        else if (roll < 0.95) loot = { icon:'🏭', text:'Бесплатная вышка!', amount:1, key:'free_rig' };
        else loot = { icon:'🛢', text:'5 бочек!', amount:5, key:'free_barrels' };
    } else if (type === 'secret') {
        if (roll < 0.5) loot = { icon:'☢', text:'5 урана!', amount:5, key:'uranium' };
        else if (roll < 0.8) loot = { icon:'🪙', text:'10000 монет!', amount:10000, key:'coins' };
        else if (roll < 0.93) loot = { icon:'💎', text:'50 алмазов!', amount:50, key:'diamond' };
        else if (roll < 0.98) loot = { icon:'🧰', text:'+3 ур. кирки!', amount:3, key:'pickaxe3' };
        else loot = { icon:'🦄', text:'Единорог бесплатно!', amount:1, key:'free_unicorn' };
    }
    
    // Применяем лут
    if (loot.key === 'coins') G.coins += loot.amount;
    else if (loot.key === 'pickaxe') { G.pickaxe.level++; G.pickaxe.power = G.pickaxe.level*3; G.pickaxe.name = PICKAXE_NAMES[G.pickaxe.level-1]||'Макс'; }
    else if (loot.key === 'god_miner') G.miners.god = (G.miners.god||0) + 1;
    else if (loot.key === 'free_rig') G.oilRigs++;
    else if (loot.key === 'free_barrels') G.barrels += 5;
    else if (loot.key === 'pickaxe3') { G.pickaxe.level = Math.min(20, G.pickaxe.level+3); G.pickaxe.power = G.pickaxe.level*3; G.pickaxe.name = PICKAXE_NAMES[G.pickaxe.level-1]||'Макс'; }
    else if (loot.key === 'free_unicorn') { if(!G.pets.includes('unicorn')) G.pets.push('unicorn'); if(!G.activePet) G.activePet='unicorn'; }
    else G.ores[loot.key] = (G.ores[loot.key]||0) + loot.amount;
    
    // Показ модалки
    document.getElementById('case-loot').textContent = loot.icon;
    document.getElementById('case-text').textContent = loot.text;
    document.getElementById('case-modal').classList.remove('hidden');
    
    Sound.caseOpen();
    checkAchievements();
    renderCases();
    saveGame();
}

document.getElementById('case-close').addEventListener('click', () => {
    document.getElementById('case-modal').classList.add('hidden');
});

renderCases();
</script>
</body>
</html>
