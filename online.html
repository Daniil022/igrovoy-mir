<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌍 Онлайн — Шахтёр-Мир</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app">
    <header class="h">
        <div class="h-res">
            <span class="badge coin">🪙 <b id="coins">100</b></span>
            <span class="badge dia">💎 <b id="diamonds">0</b></span>
        </div>
        <div class="h-lvl">⭐ <b id="level">1</b></div>
        <button class="burger-btn" onclick="location.href='index.html'">⛏</button>
    </header>

    <main class="main">
        <h2>🌍 Онлайн</h2>
        
        <!-- СТАТУС -->
        <div class="card" style="text-align:center;margin-bottom:1rem;">
            <p>👥 Игроков онлайн: <b id="online-count">0</b></p>
            <p>💬 Сообщений: <b id="msg-total">0</b></p>
            <p style="font-size:0.8rem;color:var(--text2);">Твой ник: <b id="my-nick">---</b></p>
        </div>

        <!-- ВЫБОР НИКА -->
        <div class="card" style="margin-bottom:1rem;" id="nick-block">
            <h3>👤 Придумай ник</h3>
            <input id="nick-input" type="text" placeholder="Твой ник..." maxlength="20">
            <button id="save-nick" class="action-btn boost-btn" style="margin-top:0.5rem;">✅ Войти в чат</button>
        </div>

        <!-- ЧАТ -->
        <div class="card" style="margin-bottom:1rem;" id="chat-block" style="display:none;">
            <h3>💬 Общий чат</h3>
            <div id="chat-box" style="height:350px;overflow-y:auto;background:var(--bg);padding:0.5rem;border-radius:8px;margin:0.5rem 0;">
                <p style="color:var(--text2);">Загрузка сообщений...</p>
            </div>
            <div style="display:flex;gap:0.4rem;">
                <input id="msg-input" type="text" placeholder="Сообщение..." maxlength="200" style="flex:1;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);">
                <button id="send-msg" class="action-btn boost-btn" style="width:auto;padding:0.6rem 1rem;">Отправить</button>
            </div>
        </div>

        <!-- ОБМЕН -->
        <h3>🔄 Обмен ресурсами</h3>
        <div id="trades-list" class="grid" style="margin-bottom:1rem;">
            <p style="color:var(--text2);">Нет активных обменов</p>
        </div>
        
        <button id="create-trade" class="action-btn sell-btn">📦 Создать обмен</button>

        <!-- ТОП ИГРОКОВ -->
        <h3 style="margin-top:1rem;">🏆 Топ шахтёров</h3>
        <div id="top-list"></div>
    </main>
</div>

<!-- МОДАЛКА СОЗДАНИЯ ОБМЕНА -->
<div id="trade-modal" class="modal hidden">
    <div class="modal-box">
        <h2>📦 Создать обмен</h2>
        <select id="trade-give" style="width:100%;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);margin:0.5rem 0;">
            <option value="">Выбери что отдаёшь</option>
            <option value="stone">🪨 Камень</option>
            <option value="iron">🔩 Железо</option>
            <option value="gold">🥇 Золото</option>
            <option value="diamond">💎 Алмаз</option>
            <option value="oil">🛢 Нефть</option>
        </select>
        <input id="trade-give-amount" type="number" placeholder="Количество" min="1" style="width:100%;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);margin:0.5rem 0;">
        <p style="text-align:center;">🔄</p>
        <select id="trade-want" style="width:100%;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);margin:0.5rem 0;">
            <option value="">Выбери что хочешь</option>
            <option value="stone">🪨 Камень</option>
            <option value="iron">🔩 Железо</option>
            <option value="gold">🥇 Золото</option>
            <option value="diamond">💎 Алмаз</option>
            <option value="coins">🪙 Монеты</option>
        </select>
        <input id="trade-want-amount" type="number" placeholder="Количество" min="1" style="width:100%;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);margin:0.5rem 0;">
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
            <button id="trade-cancel" class="action-btn" style="background:#555;">Отмена</button>
            <button id="trade-submit" class="action-btn sell-btn">Создать</button>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden">
    <span id="toast-icon"></span>
    <div><strong id="toast-title"></strong><p id="toast-text"></p></div>
</div>

<script src="script.js"></script>
<script>
// ==================== SUPABASE КОНФИГ ====================
const SUPABASE_URL = 'https://esjkvhkapveiqlapqcbz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzamt2aGthcHZlaXFsYXBxY2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTQ1MjksImV4cCI6MjA5MzU5MDUyOX0.X9UCcK1LChtXTGlR_3EnY8I_lnQdcHoCKI7-9Pp7B7c';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let myNick = localStorage.getItem('shahter-mir-nick') || '';

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('coins').textContent = fmt(G.coins);
    document.getElementById('diamonds').textContent = fmt(G.diamonds);
    document.getElementById('level').textContent = G.level;
    
    if (myNick) {
        showChat();
    }
    
    document.getElementById('save-nick').addEventListener('click', saveNick);
    document.getElementById('nick-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') saveNick();
    });
    
    document.getElementById('send-msg').addEventListener('click', sendMessage);
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    
    document.getElementById('create-trade').addEventListener('click', () => {
        document.getElementById('trade-modal').classList.remove('hidden');
    });
    
    document.getElementById('trade-cancel').addEventListener('click', () => {
        document.getElementById('trade-modal').classList.add('hidden');
    });
    
    document.getElementById('trade-submit').addEventListener('click', createTrade);
    
    // Подписка на чат
    subscribeToChat();
    subscribeToTrades();
    subscribeToOnline();
    loadTopPlayers();
});

// ==================== НИК ====================
function saveNick() {
    const nick = document.getElementById('nick-input').value.trim();
    if (!nick || nick.length < 2) {
        showToast('❌', 'Ошибка!', 'Ник должен быть от 2 символов');
        return;
    }
    myNick = nick;
    localStorage.setItem('shahter-mir-nick', nick);
    document.getElementById('my-nick').textContent = nick;
    document.getElementById('nick-block').style.display = 'none';
    showChat();
    showToast('✅', 'Привет, ' + nick + '!', 'Ты в чате!');
}

function showChat() {
    document.getElementById('nick-block').style.display = 'none';
    document.getElementById('chat-block').style.display = 'block';
    document.getElementById('my-nick').textContent = myNick;
    updateOnlineStatus();
}

// ==================== ЧАТ ====================
async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !myNick) return;
    
    const { error } = await sb
        .from('chat')
        .insert([{ nick: myNick, text: text, time: new Date().toISOString() }]);
    
    if (error) {
        console.error('Ошибка отправки:', error);
        showToast('❌', 'Ошибка!', 'Попробуй позже');
    }
    
    input.value = '';
}

function subscribeToChat() {
    sb
        .channel('chat-room')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat' }, (payload) => {
            addMessageToChat(payload.new);
        })
        .subscribe();
    
    // Загружаем последние сообщения
    loadMessages();
}

async function loadMessages() {
    const { data, error } = await sb
        .from('chat')
        .select('*')
        .order('time', { ascending: false })
        .limit(50);
    
    if (data) {
        document.getElementById('chat-box').innerHTML = '';
        data.reverse().forEach(msg => addMessageToChat(msg));
        document.getElementById('msg-total').textContent = data.length;
    }
}

function addMessageToChat(msg) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.style.cssText = 'margin-bottom:0.4rem;padding:0.3rem 0.5rem;background:var(--card);border-radius:6px;';
    div.innerHTML = `
        <b style="color:${msg.nick===myNick?'var(--green)':'var(--gold)'};">${msg.nick}:</b>
        <span>${msg.text}</span>
        <small style="color:var(--text2);float:right;">${new Date(msg.time).toLocaleTimeString()}</small>
    `;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ==================== ОНЛАЙН ====================
async function updateOnlineStatus() {
    if (!myNick) return;
    
    await sb
        .from('online')
        .upsert({ nick: myNick, last_seen: new Date().toISOString() }, { onConflict: 'nick' });
}

function subscribeToOnline() {
    sb
        .channel('online-room')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'online' }, () => {
            countOnline();
        })
        .subscribe();
    
    countOnline();
}

async function countOnline() {
    const { data, error } = await sb
        .from('online')
        .select('*')
        .gte('last_seen', new Date(Date.now() - 60000).toISOString());
    
    if (data) {
        document.getElementById('online-count').textContent = data.length;
    }
}

// Обновляем онлайн каждые 30 секунд
setInterval(updateOnlineStatus, 30000);
updateOnlineStatus();

// ==================== ОБМЕН ====================
async function createTrade() {
    const give = document.getElementById('trade-give').value;
    const giveAmount = parseInt(document.getElementById('trade-give-amount').value);
    const want = document.getElementById('trade-want').value;
    const wantAmount = parseInt(document.getElementById('trade-want-amount').value);
    
    if (!give || !want || !giveAmount || !wantAmount) {
        showToast('❌', 'Заполни все поля!', '');
        return;
    }
    
    if (G.ores[give] < giveAmount) {
        showToast('❌', 'Не хватает ресурсов!', 'У тебя ' + fmt(G.ores[give]) + ' ' + give);
        return;
    }
    
    G.ores[give] -= giveAmount;
    saveGame();
    
    const { error } = await sb
        .from('trades')
        .insert([{
            nick: myNick,
            give: give,
            give_amount: giveAmount,
            want: want,
            want_amount: wantAmount,
            time: new Date().toISOString(),
            active: true
        }]);
    
    if (error) {
        console.error('Ошибка:', error);
        showToast('❌', 'Ошибка создания обмена!', '');
    } else {
        document.getElementById('trade-modal').classList.add('hidden');
        showToast('📦', 'Обмен создан!', giveAmount + ' ' + give + ' → ' + wantAmount + ' ' + want);
    }
}

function subscribeToTrades() {
    sb
        .channel('trades-room')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'trades' }, () => {
            loadTrades();
        })
        .subscribe();
    
    loadTrades();
}

async function loadTrades() {
    const { data, error } = await sb
        .from('trades')
        .select('*')
        .eq('active', true)
        .order('time', { ascending: false })
        .limit(10);
    
    if (data && data.length > 0) {
        document.getElementById('trades-list').innerHTML = data.map((t, i) => `
            <div class="card">
                <p><b>${t.nick}</b></p>
                <p>📤 ${t.give_amount} ${t.give} → 📥 ${t.want_amount} ${t.want}</p>
                <small style="color:var(--text2);">${new Date(t.time).toLocaleTimeString()}</small>
                ${t.nick !== myNick ? `<button onclick="acceptTrade(${t.id})" class="action-btn boost-btn" style="margin-top:0.3rem;">Принять</button>` : ''}
            </div>
        `).join('');
    } else {
        document.getElementById('trades-list').innerHTML = '<p style="color:var(--text2);">Нет активных обменов</p>';
    }
}

async function acceptTrade(id) {
    const { data, error } = await sb
        .from('trades')
        .select('*')
        .eq('id', id)
        .single();
    
    if (!data || error) return;
    
    // Проверяем, есть ли у нас нужный ресурс
    if (data.want === 'coins') {
        if (G.coins < data.want_amount) {
            showToast('❌', 'Не хватает монет!', '');
            return;
        }
        G.coins -= data.want_amount;
        G.ores[data.give] = (G.ores[data.give] || 0) + data.give_amount;
    } else {
        if ((G.ores[data.want] || 0) < data.want_amount) {
            showToast('❌', 'Не хватает ' + data.want + '!', '');
            return;
        }
        G.ores[data.want] -= data.want_amount;
        G.ores[data.give] = (G.ores[data.give] || 0) + data.give_amount;
    }
    
    saveGame();
    
    await sb.from('trades').update({ active: false }).eq('id', id);
    
    document.getElementById('coins').textContent = fmt(G.coins);
    showToast('✅', 'Обмен выполнен!', '');
}

// ==================== ТОП ====================
async function loadTopPlayers() {
    const { data, error } = await sb
        .from('online')
        .select('*')
        .order('last_seen', { ascending: false })
        .limit(10);
    
    if (data) {
        document.getElementById('top-list').innerHTML = data.map((p, i) => `
            <div class="card" style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.3rem;">
                <span style="font-size:1.5rem;">${['🥇','🥈','🥉'][i] || '👤'}</span>
                <div>
                    <b>${p.nick}</b>
                    <p style="font-size:0.7rem;color:var(--text2);">Был: ${new Date(p.last_seen).toLocaleTimeString()}</p>
                </div>
            </div>
        `).join('');
    }
}
</script>
</body>
</html>
