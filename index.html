<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>VR HOUSE • Панель сотрудника</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0d1117; color: #e6edf3; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; padding: 20px 0; overflow-y: auto; }
        .logo { padding: 0 20px 18px; border-bottom: 1px solid #30363d; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
        .logo i { color: #a855f7; font-size: 24px; }
        .logo span { background: linear-gradient(135deg, #c084fc, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-label { padding: 14px 20px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #8b949e; font-weight: 700; }
        .nav-item { padding: 10px 20px; display: flex; align-items: center; gap: 10px; color: #8b949e; cursor: pointer; border-left: 3px solid transparent; font-size: 13px; font-weight: 500; transition: 0.15s; }
        .nav-item:hover { background: #1c2128; color: #fff; }
        .nav-item.active { color: #a855f7; background: rgba(168,85,247,0.08); border-left-color: #a855f7; }
        .nav-item i { width: 18px; text-align: center; }
        .lock-icon { margin-left: auto; font-size: 10px; color: #d2991d; }
        .nav-badge { margin-left: auto; background: #a855f7; font-size: 10px; padding: 2px 7px; border-radius: 10px; color: #fff; font-weight: 700; }
        .main { margin-left: 260px; flex: 1; padding: 24px 28px; min-width: 0; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .topbar h1 { font-size: 22px; font-weight: 700; }
        .live-clock { background: #1c2128; border: 1px solid #30363d; padding: 8px 14px; border-radius: 8px; font-size: 13px; color: #8b949e; }
        .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-purple { background: #a855f7; color: #fff; }
        .btn-purple:hover { background: #9333ea; }
        .btn-outline { background: transparent; border: 1px solid #30363d; color: #e6edf3; }
        .btn-outline:hover { border-color: #fff; }
        .btn-red { background: transparent; border: 1px solid #f85149; color: #f85149; }
        .btn-red:hover { background: #f85149; color: #fff; }
        .btn-green { background: transparent; border: 1px solid #3fb950; color: #3fb950; }
        .btn-green:hover { background: #3fb950; color: #000; }
        .btn-blue { background: transparent; border: 1px solid #58a6ff; color: #58a6ff; }
        .btn-blue:hover { background: #58a6ff; color: #000; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .btn-yellow { background: transparent; border: 1px solid #d2991d; color: #d2991d; }
        .btn-yellow:hover { background: #d2991d; color: #000; }

        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .summary-card { background: #1c2128; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
        .summary-card .sc-val { font-size: 26px; font-weight: 700; }
        .summary-card .sc-label { font-size: 11px; color: #8b949e; text-transform: uppercase; }

        .section-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; margin-top: 20px; display: flex; align-items: center; gap: 8px; }
        .eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .eq-card { background: #1c2128; border: 2px solid #30363d; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .eq-card.ok { border-color: #1f3322; background: #111a13; }
        .eq-card.issue { border-color: #f85149; background: #1f1111; }
        .eq-card.moved { border-color: #58a6ff; background: #0f1a2e; }
        .eq-card i { font-size: 24px; color: #8b949e; }
        .eq-card.ok i { color: #3fb950; }
        .eq-card.issue i { color: #f85149; }
        .eq-card.moved i { color: #58a6ff; }
        .eq-card .eq-name { font-size: 11px; font-weight: 600; margin-top: 6px; }
        .eq-card .eq-status { font-size: 10px; font-weight: 700; margin-top: 4px; }

        /* VR-игры */
        .vr-helmets-list { display: flex; flex-direction: column; gap: 20px; }
        .vr-helmet-card { background: #1c2128; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; }
        .vr-helmet-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #161b22; border-bottom: 1px solid #30363d; cursor: pointer; }
        .vr-helmet-header:hover { background: #1f242d; }
        .vr-helmet-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .vr-helmet-stats { font-size: 12px; color: #3fb950; }
        .vr-games-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
        .vr-game-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #0d1117; border-radius: 8px; border-left: 3px solid #a855f7; }
        .vr-game-name { font-size: 14px; font-weight: 500; }
        .vr-game-actions { display: flex; gap: 8px; }
        .empty-games { color: #8b949e; font-size: 13px; text-align: center; padding: 20px; font-style: italic; }
        .add-game-form { display: flex; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #30363d; }
        .add-game-form button { flex-shrink: 0; }

        /* Задачи */
        .task-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
        .task-card { background: #1c2128; border: 1px solid #30363d; border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; transition: 0.2s; }
        .task-card.done { opacity: 0.6; background: #0a0e14; }
        .task-card.overdue { border-color: #f85149; background: #1f1111; border-width: 2px; }
        .task-left { display: flex; align-items: center; gap: 14px; flex: 2; }
        .task-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: #3fb950; }
        .task-title { font-weight: 600; font-size: 14px; }
        .task-desc { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .task-dates { font-size: 11px; color: #58a6ff; margin-top: 4px; }
        .task-overdue-warning { font-size: 11px; color: #f85149; margin-top: 4px; font-weight: bold; }
        .task-reject-reason { font-size: 11px; color: #f85149; margin-top: 6px; font-style: italic; }
        .task-assignee { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 10px; }
        .task-priority { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; }
        .priority-high { background: rgba(248,81,73,0.2); color: #f85149; }
        .priority-medium { background: rgba(210,153,29,0.2); color: #d2991d; }
        .priority-low { background: rgba(63,185,80,0.2); color: #3fb950; }
        .assignee-pasha { background: rgba(255,107,107,0.2); color: #ff6b6b; border-left: 3px solid #ff6b6b; }
        .assignee-tanya { background: rgba(255,159,67,0.2); color: #ff9f43; border-left: 3px solid #ff9f43; }
        .assignee-nura { background: rgba(243,104,224,0.2); color: #f368e0; border-left: 3px solid #f368e0; }
        .assignee-yura { background: rgba(72,219,251,0.2); color: #48dbfb; border-left: 3px solid #48dbfb; }
        .assignee-konstantin { background: rgba(29,209,161,0.2); color: #1dd1a1; border-left: 3px solid #1dd1a1; }
        .assignee-artem { background: rgba(95,39,205,0.2); color: #5f27cd; border-left: 3px solid #5f27cd; }
        .assignee-nikita { background: rgba(0,210,211,0.2); color: #00d2d3; border-left: 3px solid #00d2d3; }
        .assignee-daniil { background: rgba(168,85,247,0.2); color: #a855f7; border-left: 3px solid #a855f7; }

        /* Перемещения (карточки) */
        .moves-grid, .issues-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .move-card, .issue-card { background: #1c2128; border: 1px solid #30363d; border-radius: 12px; padding: 16px; transition: 0.2s; cursor: pointer; }
        .move-card:hover, .issue-card:hover { border-color: #a855f7; transform: translateY(-2px); }
        .move-card-header, .issue-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .move-card-id { color: #a855f7; font-size: 12px; font-weight: 600; }
        .issue-card-id { color: #f85149; font-size: 12px; font-weight: 600; }
        .move-card-status { font-size: 10px; padding: 4px 8px; border-radius: 20px; background: rgba(63,185,80,0.2); color: #3fb950; }
        .move-card-status.returned { background: rgba(88,166,255,0.2); color: #58a6ff; }
        .issue-card-status { font-size: 10px; padding: 4px 8px; border-radius: 20px; }
        .status-open { background: rgba(248,81,73,0.2); color: #f85149; }
        .status-done { background: rgba(63,185,80,0.2); color: #3fb950; }
        .move-card-equip, .issue-card-equip { font-size: 16px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .move-card-category { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
        .move-card-desc, .issue-card-desc { font-size: 12px; color: #8b949e; margin-bottom: 12px; padding: 8px; background: #0d1117; border-radius: 8px; }
        .move-card-footer, .issue-card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #8b949e; margin-top: 12px; flex-wrap: wrap; gap: 8px; }
        .issue-card-priority { font-size: 10px; padding: 2px 8px; border-radius: 12px; }
        .priority-high-card { background: rgba(248,81,73,0.2); color: #f85149; }
        .priority-medium-card { background: rgba(210,153,29,0.2); color: #d2991d; }
        .priority-low-card { background: rgba(63,185,80,0.2); color: #3fb950; }
        .issue-card-image { max-width: 100%; max-height: 100px; border-radius: 8px; cursor: pointer; margin-top: 8px; }
        .empty-moves, .empty-issues { text-align: center; padding: 40px; color: #8b949e; background: #1c2128; border-radius: 12px; }

        /* Цвета должностей */
        .role-director { background: rgba(168,85,247,0.2); color: #a855f7; border-left: 3px solid #a855f7; }
        .role-manager { background: rgba(88,166,255,0.2); color: #58a6ff; border-left: 3px solid #58a6ff; }
        .role-tech { background: rgba(63,185,80,0.2); color: #3fb950; border-left: 3px solid #3fb950; }
        .role-admin { background: rgba(210,153,29,0.2); color: #d2991d; border-left: 3px solid #d2991d; }
        .role-operator { background: rgba(240,98,146,0.2); color: #f06292; border-left: 3px solid #f06292; }

        /* Панель управляющего */
        .manager-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 12px; flex-wrap: wrap; }
        .manager-tab-btn { background: transparent; border: none; color: #8b949e; padding: 8px 16px; cursor: pointer; border-radius: 8px; font-size: 13px; transition: 0.2s; }
        .manager-tab-btn:hover { background: #1c2128; color: #fff; }
        .manager-tab-btn.active { background: #a855f7; color: #fff; }
        
        .users-table { width: 100%; border-collapse: collapse; }
        .users-table th, .users-table td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; }
        .users-table th { color: #8b949e; font-size: 11px; text-transform: uppercase; }
        .role-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        
        .salary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .salary-card { background: #1c2128; border: 1px solid #30363d; border-radius: 12px; padding: 16px; }
        .salary-card h4 { margin-bottom: 12px; color: #a855f7; }
        .salary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #30363d; }
        .salary-total { font-size: 18px; font-weight: 700; color: #3fb950; margin-top: 12px; padding-top: 12px; border-top: 2px solid #3fb950; }

        /* Профиль */
        .profile-card { background: #1c2128; border: 1px solid #30363d; border-radius: 12px; padding: 24px; max-width: 500px; margin: 0 auto; }
        .profile-field { margin-bottom: 20px; }
        .profile-field label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 4px; text-transform: uppercase; }
        .profile-field input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; }

        .shift-block { background: #1c2128; border: 2px solid #3fb950; border-radius: 16px; padding: 28px; text-align: center; margin-bottom: 24px; }
        .shift-block.inactive { border-color: #30363d; }

        .table-wrap { background: #1c2128; border: 1px solid #30363d; border-radius: 10px; overflow-x: auto; margin-bottom: 28px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 18px; font-size: 11px; color: #8b949e; border-bottom: 1px solid #30363d; }
        td { padding: 12px 18px; font-size: 13px; border-bottom: 1px solid #1a1f26; }

        /* Календарь */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 24px; }
        .calendar-day-header { text-align: center; padding: 10px; font-size: 12px; color: #8b949e; font-weight: 600; }
        .calendar-day { background: #1c2128; border: 1px solid #30363d; border-radius: 8px; min-height: 80px; padding: 8px; cursor: pointer; transition: 0.2s; }
        .calendar-day:hover { background: #2d333b; }
        .calendar-day.empty { background: transparent; border-color: transparent; cursor: default; }
        .calendar-day.today { border-color: #a855f7; background: rgba(168,85,247,0.1); }
        .calendar-day.has-shifts { border-color: #3fb950; }
        .calendar-day-number { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .calendar-shift-count { font-size: 10px; color: #3fb950; }
        .calendar-shift-list { font-size: 10px; color: #8b949e; margin-top: 4px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; }
        .modal { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 24px; width: 550px; max-width: 90vw; max-height: 85vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 16px; font-size: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 4px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 14px; outline: none; }
        .date-row { display: flex; gap: 12px; }
        .date-row .form-group { flex: 1; }
        .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
        .hidden { display: none !important; }

        .toast { position: fixed; bottom: 24px; right: 24px; background: #1c2128; border: 1px solid #3fb950; border-radius: 10px; padding: 12px 20px; z-index: 999; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Лицензия */
        .license-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .license-card { background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 40px; width: 450px; text-align: center; }
        .license-card input { width: 100%; padding: 12px; margin: 15px 0; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 16px; text-align: center; }
        .license-key-display { background: #0d1117; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 18px; letter-spacing: 2px; margin: 15px 0; border: 1px solid #a855f7; }
        .device-id-display { font-size: 10px; color: #8b949e; margin-top: 15px; word-break: break-all; }

        /* Авторизация */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1500; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .main { margin-left: 200px; padding: 16px; }
            .moves-grid, .issues-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Экран лицензии -->
    <div id="licenseScreen" class="license-overlay">
        <div class="license-card">
            <i class="fas fa-vr-cardboard" style="font-size: 64px; color: #a855f7; margin-bottom: 20px;"></i>
            <h2 style="margin-bottom: 10px;">VR HOUSE</h2>
            <p style="color: #8b949e; margin-bottom: 15px; font-size: 13px;">Активация лицензии</p>
            <div id="licenseKeyDisplay" class="license-key-display"></div>
            <input type="text" id="licenseKeyInput" placeholder="Введите лицензионный ключ">
            <div id="licenseError" style="color:#f85149; font-size:12px; margin:10px 0; display:none;"></div>
            <button class="btn btn-purple" style="width:100%;" onclick="checkLicense()">Активировать</button>
            <div id="deviceIdDisplay" class="device-id-display"></div>
            <p style="color:#8b949e; font-size:10px; margin-top:15px;">© 2025 VR House. Все права защищены.</p>
        </div>
    </div>

    <aside class="sidebar" id="sidebar" style="display:none;"></aside>
    <main class="main" id="mainContent" style="display:none;"></main>

    <!-- Модальные окна (все из твоего рабочего кода) -->
    <div class="modal-overlay hidden" id="modalPassword"><div class="modal"><h3><i class="fas fa-lock"></i> Введите пароль</h3><input type="password" id="passwordInput" placeholder="Пароль"><div id="passwordError" class="hidden">Неверный пароль!</div><div class="btn-row"><button class="btn btn-outline" id="btnCancelPassword">Отмена</button><button class="btn btn-purple" id="btnSubmitPassword">Подтвердить</button></div></div></div>
    <div class="modal-overlay hidden" id="modalTask"><div class="modal"><h3>Новая задача</h3><div class="form-group"><label>Название</label><input type="text" id="taskTitle"></div><div class="form-group"><label>Описание</label><textarea id="taskDesc" rows="3"></textarea></div><div class="date-row"><div class="form-group"><label>Дата начала</label><input type="date" id="taskDateFrom"></div><div class="form-group"><label>Дата окончания</label><input type="date" id="taskDateTo"></div></div><div class="form-group"><label>Исполнитель</label><select id="taskAssignee"><option>Паша</option><option>Таня</option><option>Нура</option><option>Юра</option><option>Константин</option><option>Артём</option><option>Никита</option><option>Даниил</option></select></div><div class="form-group"><label>Важность</label><select id="taskPriority"><option value="high">Высокая</option><option value="medium">Средняя</option><option value="low">Низкая</option></select></div><div class="btn-row"><button class="btn btn-outline" id="btnCancelTask">Отмена</button><button class="btn btn-purple" id="btnSubmitTask">Создать</button></div></div></div>
    <div class="modal-overlay hidden" id="modalAddGame"><div class="modal"><h3>Добавить игру</h3><div class="form-group"><label>Название</label><input type="text" id="newGameName"></div><div class="form-group"><label>Описание</label><textarea id="newGameDesc" rows="2"></textarea></div><div class="btn-row"><button class="btn btn-outline" id="btnCancelGame">Отмена</button><button class="btn btn-purple" id="btnSubmitGame">Добавить</button></div></div></div>
    <div class="modal-overlay hidden" id="modalRejectReason"><div class="modal"><h3>Причина невыполнения</h3><textarea id="rejectReason" rows="4"></textarea><div class="btn-row"><button class="btn btn-outline" id="btnCancelReject">Отмена</button><button class="btn btn-red" id="btnSubmitReject">Подтвердить</button></div></div></div>

    <div class="modal-overlay hidden" id="modalMoveEquipment"><div class="modal"><h3>Перемещение</h3><div class="form-group"><label>Оборудование</label><select id="selectMoveEquipment"></select></div><div class="form-group"><label>Категория</label><select id="selectMoveCategory"><option value="park">Парк</option><option value="event">Мероприятие</option><option value="repair">Ремонт</option><option value="staff">Сотрудник</option></select></div><div class="form-group"><label>Описание</label><textarea id="inputMoveDesc" rows="2"></textarea></div><div class="form-group"><label>Кто взял</label><input type="text" id="inputMoveStaffName"></div><div class="form-group"><label>Телефон</label><input type="text" id="inputMovePhone"></div><div class="btn-row"><button class="btn btn-outline" id="btnCancelMove">Отмена</button><button class="btn btn-blue" id="btnSubmitMove">Зафиксировать</button></div></div></div>
    <div class="modal-overlay hidden" id="modalAddEmployee"><div class="modal"><h3>Добавить сотрудника</h3><div class="form-group"><label>Имя</label><input type="text" id="empName"></div><div class="form-group"><label>Телефон</label><input type="text" id="empPhone"></div><div class="form-group"><label>Telegram</label><input type="text" id="empTg"></div><div class="form-group"><label>Должность</label><select id="empRole"><option value="director">Директор</option><option value="manager">Управляющий</option><option value="tech">Техник/Сис.Админ</option><option value="admin">Администратор</option><option value="operator">Оператор</option></select></div><div class="form-group"><label>Пароль</label><input type="text" id="empPassword" value="1234"></div><div class="btn-row"><button class="btn btn-outline" id="btnCancelEmp">Отмена</button><button class="btn btn-purple" id="btnSubmitEmp">Добавить</button></div></div></div>
    <div class="modal-overlay hidden" id="modalChangePassword"><div class="modal"><h3>Смена пароля</h3><div class="form-group"><label>Текущий пароль</label><input type="password" id="oldPass"></div><div class="form-group"><label>Новый пароль</label><input type="password" id="newPass1"></div><div class="form-group"><label>Подтверждение</label><input type="password" id="newPass2"></div><div class="btn-row"><button class="btn btn-outline" id="btnCancelPass">Отмена</button><button class="btn btn-purple" id="btnSubmitPass">Сменить пароль</button></div></div></div>

    <script>
        // ============ ЛИЦЕНЗИОННАЯ ЗАЩИТА ============
        const STORAGE_KEY = 'vrhouse_data_v18';
        const LICENSES = ['VRH-2025-ADMIN-001', 'VRH-DEMO-2025-001', 'VRH-TEST-2025-001'];
        let currentUser = null;
        let currentTab = 'dashboard';
        
        function getDeviceId() {
            let deviceId = localStorage.getItem('vrhouse_device_id');
            if (!deviceId) {
                deviceId = 'DEV-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 8);
                localStorage.setItem('vrhouse_device_id', deviceId);
            }
            return deviceId;
        }
        
        function checkLicense() {
            const inputKey = document.getElementById('licenseKeyInput').value.trim().toUpperCase();
            if (LICENSES.includes(inputKey)) {
                localStorage.setItem('vrhouse_license', inputKey);
                localStorage.setItem('vrhouse_licensed_device', getDeviceId());
                document.getElementById('licenseScreen').style.display = 'none';
                showLoginScreen();
                showToast('✅ Лицензия активирована!');
            } else {
                document.getElementById('licenseError').textContent = 'Неверный ключ!';
                document.getElementById('licenseError').style.display = 'block';
            }
        }
        
        function generateDisplayKey() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let key = 'VRH-';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 4; j++) key += chars.charAt(Math.floor(Math.random() * chars.length));
                if (i < 2) key += '-';
            }
            return key;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('licenseKeyDisplay').textContent = generateDisplayKey();
            document.getElementById('deviceIdDisplay').textContent = 'ID устройства: ' + getDeviceId();
            const savedLicense = localStorage.getItem('vrhouse_license');
            const savedDevice = localStorage.getItem('vrhouse_licensed_device');
            if (savedLicense && LICENSES.includes(savedLicense) && savedDevice === getDeviceId()) {
                document.getElementById('licenseScreen').style.display = 'none';
                showLoginScreen();
            }
        });

        // ============ АВТОРИЗАЦИЯ ============
        function showLoginScreen() {
            const loginDiv = document.createElement('div');
            loginDiv.id = 'loginScreenDiv';
            loginDiv.className = 'login-overlay';
            loginDiv.innerHTML = `
                <div style="background:#161b22; border:1px solid #30363d; border-radius:20px; padding:40px; width:400px; text-align:center;">
                    <i class="fas fa-vr-cardboard" style="font-size:64px; color:#a855f7; margin-bottom:20px;"></i>
                    <h2 style="margin-bottom:20px;">VR HOUSE</h2>
                    <input type="text" id="loginName" placeholder="Имя" style="width:100%; padding:12px; margin:10px 0; background:#0d1117; border:1px solid #30363d; border-radius:8px; color:#fff;">
                    <input type="password" id="loginPass" placeholder="Пароль" style="width:100%; padding:12px; margin:10px 0; background:#0d1117; border:1px solid #30363d; border-radius:8px; color:#fff;">
                    <div id="loginErrorMsg" style="color:#f85149; margin:10px 0; display:none;"></div>
                    <button class="btn btn-purple" style="width:100%;" onclick="attemptLogin()">Войти</button>
                </div>
            `;
            document.body.appendChild(loginDiv);
        }
        
        function getRoleName(role) {
            const roles = { director: 'Директор', manager: 'Управляющий', tech: 'Техник/Сис.Админ', admin: 'Администратор', operator: 'Оператор' };
            return roles[role] || 'Сотрудник';
        }
        
        function attemptLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value;
            const user = Users.find(u => u.name.toLowerCase() === name.toLowerCase() && u.password === pass);
            if (user) {
                currentUser = user;
                document.getElementById('loginScreenDiv').remove();
                document.querySelector('.sidebar').style.display = 'flex';
                document.querySelector('.main').style.display = 'block';
                buildSidebar();
                switchTab('dashboard');
                showToast(`👋 Добро пожаловать, ${user.name}!`);
            } else {
                document.getElementById('loginErrorMsg').textContent = 'Неверное имя или пароль!';
                document.getElementById('loginErrorMsg').style.display = 'block';
            }
        }

        // ============ КОНФИГУРАЦИЯ ============
        const HOURLY_RATE = 100;
        const PASSWORD = '9753';
        const PROTECTED_TABS = ['shift', 'calendar_history'];
        
        const SALARY_COMPONENTS = [
            { name: 'Оклад', type: 'fixed', default: 50000, unit: '₽' },
            { name: 'Почасовая ставка', type: 'hourly', default: 100, unit: '₽/час' },
            { name: 'Бонус за смену', type: 'per_shift', default: 50, unit: '₽/смена' },
            { name: 'Бонус за задачу', type: 'per_task', default: 20, unit: '₽/задача' },
            { name: 'Премия за KPI', type: 'kpi', default: 5000, unit: '₽' },
            { name: 'Районный коэффициент', type: 'percent', default: 15, unit: '%' },
            { name: 'Выслуга лет', type: 'percent', default: 5, unit: '%' },
            { name: 'Ночные смены', type: 'extra', default: 200, unit: '₽/ночь' },
            { name: 'Сверхурочные', type: 'overtime', default: 150, unit: '₽/час' },
            { name: 'Проектная премия', type: 'project', default: 3000, unit: '₽' }
        ];

        // ============ ДАННЫЕ (из твоего рабочего кода) ============
        let Categories = {};
        let Issues = { list: [], nextId: 1 };
        let Shift = { active: false, staffName: '', startTime: null };
        let Moves = { list: [], nextId: 1 };
        let ShiftsHistory = [];
        let Tasks = [];
        let currentImageData = null;
        let currentHelmetForGame = null;
        let selectedEquipments = new Set();
        
        let Users = [
            { id: 1, name: 'Паша', phone: '+7-999-111-1111', tg: '@pasha', role: 'operator', password: '1234', tempPassword: true, createdAt: new Date().toISOString() },
            { id: 2, name: 'Таня', phone: '+7-999-222-2222', tg: '@tanya', role: 'operator', password: '1234', tempPassword: true, createdAt: new Date().toISOString() },
            { id: 3, name: 'Даниил', phone: '+7-999-000-0000', tg: '@danil', role: 'director', password: 'admin123', tempPassword: false, createdAt: new Date().toISOString() }
        ];
        
        let UserSalarySettings = {};

        const CATEGORY_DEFS = [
            { id: 'helmets', name: 'VR-шлемы', icon: 'fa-vr-cardboard', color: '#a855f7' },
            { id: 'buttons', name: 'Кнопки', icon: 'fa-circle', color: '#d2991d' },
            { id: 'psu', name: 'Блоки питания', icon: 'fa-plug', color: '#f0883e' },
            { id: 'monitors', name: 'Мониторы', icon: 'fa-desktop', color: '#58a6ff' },
            { id: 'xbox', name: 'Xbox', icon: 'fa-xbox', color: '#3fb950' },
            { id: 'sim', name: 'Автосимуляторы', icon: 'fa-car', color: '#f85149' },
            { id: 'vrpb', name: 'VR-повербанки', icon: 'fa-battery-full', color: '#4db6ac' },
            { id: 'pb', name: 'Повербанки', icon: 'fa-battery-half', color: '#f06292' }
        ];

        function initCategories() {
            CATEGORY_DEFS.forEach(c => { Categories[c.id] = []; });
            for (let i = 1; i <= 13; i++) {
                Categories.helmets.push({ id: 'h' + i, name: 'VR-шлем ' + i, icon: 'fa-vr-cardboard', status: 'ok', moveId: null, games: [] });
            }
            if (Categories.helmets[0]) Categories.helmets[0].games = [{ id: 1, name: "Beat Saber", desc: "Ритм-игра" }, { id: 2, name: "Half-Life: Alyx", desc: "Шутер" }];
            if (Categories.helmets[1]) Categories.helmets[1].games = [{ id: 3, name: "Superhot VR", desc: "Экшен" }];
            Categories.sim.push({ id: 'sim1', name: 'Автосимулятор', icon: 'fa-car', status: 'ok', moveId: null });
            for (let i = 1; i <= 2; i++) Categories.xbox.push({ id: 'xbox' + i, name: 'Xbox ' + i, icon: 'fa-xbox', status: 'ok', moveId: null });
            for (let i = 1; i <= 9; i++) Categories.buttons.push({ id: 'btn' + i, name: 'Кнопка ' + i, icon: 'fa-circle', status: 'ok', moveId: null });
            for (let i = 1; i <= 2; i++) Categories.psu.push({ id: 'psu' + i, name: 'Блок питания ' + i, icon: 'fa-plug', status: 'ok', moveId: null });
            for (let i = 1; i <= 4; i++) Categories.monitors.push({ id: 'mon' + i, name: 'Монитор ' + i, icon: 'fa-desktop', status: 'ok', moveId: null });
            for (let i = 1; i <= 30; i++) Categories.vrpb.push({ id: 'vrpb' + i, name: 'VR-повербанк ' + i, icon: 'fa-battery-full', status: 'ok', moveId: null });
            for (let i = 1; i <= 5; i++) Categories.pb.push({ id: 'pb' + i, name: 'Повербанк ' + i, icon: 'fa-battery-half', status: 'ok', moveId: null });
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    Categories = data.categories || {};
                    Issues = data.issues || { list: [], nextId: 1 };
                    Shift = data.shift || { active: false, staffName: '', startTime: null };
                    Moves = { list: data.moves || [], nextId: (data.moves?.length ? Math.max(...data.moves.map(m => m.id)) + 1 : 1) };
                    ShiftsHistory = data.shiftsHistory || [];
                    Tasks = data.tasks || [];
                    Users = data.users || Users;
                    UserSalarySettings = data.userSalarySettings || {};
                    CATEGORY_DEFS.forEach(c => { if (!Categories[c.id]) Categories[c.id] = []; });
                    if (Categories.helmets) Categories.helmets.forEach(h => { if (!h.games) h.games = []; });
                    if (Object.values(Categories).flat().length === 0) initCategories();
                } catch(e) { initCategories(); }
            } else { initCategories(); }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                categories: Categories, issues: Issues, shift: Shift, moves: Moves.list,
                shiftsHistory: ShiftsHistory, tasks: Tasks, users: Users,
                userSalarySettings: UserSalarySettings
            }));
        }

        function getAllEquip() { return Object.values(Categories).flat(); }
        function findEquip(id) { return getAllEquip().find(e => e.id === id); }
        function getEquipStatus(item) { if (item.moveId) return 'moved'; if (item.status === 'issue') return 'issue'; return 'ok'; }
        function getEquipStatusText(item) { if (item.moveId) return 'ПЕРЕМЕЩЕНО'; if (item.status === 'issue') return 'НЕИСПРАВНО'; return 'ИСПРАВНО'; }
        function getStats() { const all = getAllEquip(); return { total: all.length, ok: all.filter(e => !e.moveId && e.status === 'ok').length, issue: all.filter(e => !e.moveId && e.status === 'issue').length, moved: all.filter(e => e.moveId).length, activeIssues: Issues.list.filter(i => i.status !== 'done' && i.status !== 'cantfix').length }; }
        function calcPay(startTime) { if (!startTime) return 0; return Math.floor((new Date() - new Date(startTime)) / 3600000) * HOURLY_RATE; }
        function showToast(msg) { const old = document.querySelector('.toast'); if (old) old.remove(); const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
        function openModal(id) { const modal = document.getElementById(id); if (modal) modal.classList.remove('hidden'); }
        function closeModal(id) { const modal = document.getElementById(id); if (modal) modal.classList.add('hidden'); }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

        // ============ ВСЕ ТВОИ ФУНКЦИИ (VR-ИГРЫ, ЗАДАЧИ, ПЕРЕМЕЩЕНИЯ, ПРОБЛЕМЫ, СМЕНЫ, КАЛЕНДАРЬ) ============
        // VR-ИГРЫ
        function openAddGameModal(helmetId) { currentHelmetForGame = helmetId; document.getElementById('newGameName').value = ''; document.getElementById('newGameDesc').value = ''; openModal('modalAddGame'); }
        function addGameToHelmet() { const name = document.getElementById('newGameName').value.trim(); if (!name) return showToast('Введите название'); const helmet = findEquip(currentHelmetForGame); if (helmet) { const newId = helmet.games.length ? Math.max(...helmet.games.map(g => g.id)) + 1 : 1; helmet.games.push({ id: newId, name: name, desc: document.getElementById('newGameDesc').value }); saveData(); renderVRGames(); showToast(`✅ Игра добавлена`); } closeModal('modalAddGame'); }
        function removeGameFromHelmet(helmetId, gameId) { const helmet = findEquip(helmetId); if (helmet) { helmet.games = helmet.games.filter(g => g.id !== gameId); saveData(); renderVRGames(); showToast(`❌ Игра удалена`); } }
        function renderVRGames() { const helmets = Categories.helmets || []; const totalGames = helmets.reduce((s, h) => s + (h.games?.length || 0), 0); let html = `<div class="topbar"><h1>VR-шлемы и игры</h1><div><span class="live-clock" id="liveClock"></span></div></div><div class="summary"><div class="summary-card"><div class="sc-val">${helmets.length}</div><div class="sc-label">VR-шлемов</div></div><div class="summary-card"><div class="sc-val" style="color:#58a6ff">${totalGames}</div><div class="sc-label">Всего игр</div></div></div><div class="vr-helmets-list">`;
            helmets.forEach(helmet => { const games = helmet.games || []; html += `<div class="vr-helmet-card"><div class="vr-helmet-header" onclick="toggleHelmetGames('${helmet.id}')"><div class="vr-helmet-title"><i class="fas fa-vr-cardboard"></i><span>${helmet.name}</span></div><div class="vr-helmet-stats">🎮 ${games.length} игр</div></div><div class="vr-games-list" id="games-${helmet.id}">`;
                if (games.length === 0) html += `<div class="empty-games">📭 Нет игр</div>`;
                else games.forEach(game => { html += `<div class="vr-game-item"><div class="vr-game-name"><i class="fas fa-gamepad"></i> ${escapeHtml(game.name)}${game.desc ? `<div style="font-size:10px;color:#8b949e;">${escapeHtml(game.desc)}</div>` : ''}</div><div class="vr-game-actions"><button class="btn btn-red btn-sm" onclick="removeGameFromHelmet('${helmet.id}', ${game.id})"><i class="fas fa-trash"></i></button></div></div>`; });
                html += `<div class="add-game-form"><button class="btn btn-green btn-sm" onclick="openAddGameModal('${helmet.id}')"><i class="fas fa-plus"></i> Добавить игру</button></div></div></div>`;
            }); html += `</div>`; document.getElementById('mainContent').innerHTML = html; }
        function toggleHelmetGames(helmetId) { const el = document.getElementById(`games-${helmetId}`); if (el) el.style.display = el.style.display === 'none' ? 'flex' : 'none'; }
        function addGameToHelmetById(helmetId) { const nameInput = document.getElementById('newGameNameInput'); const descInput = document.getElementById('newGameDescInput'); const name = nameInput?.value.trim(); const desc = descInput?.value.trim() || ''; if (!name) return showToast('Введите название игры'); const helmet = findEquip(helmetId); if (helmet) { const newId = helmet.games.length ? Math.max(...helmet.games.map(g => g.id)) + 1 : 1; helmet.games.push({ id: newId, name: name, desc: desc }); saveData(); renderVRGames(); showToast(`✅ Игра "${name}" добавлена`); } }

        // КАЛЕНДАРЬ
        let currentCalendarDate = new Date();
        function renderCalendarAndHistory() {
            const now = currentCalendarDate; const year = now.getFullYear(); const month = now.getMonth();
            const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate(); let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            const shiftsByDay = {}; ShiftsHistory.forEach(shift => { const dateKey = new Date(shift.start).toISOString().slice(0,10); if (!shiftsByDay[dateKey]) shiftsByDay[dateKey] = []; shiftsByDay[dateKey].push(shift); });
            const totalShifts = ShiftsHistory.length; const totalEarned = ShiftsHistory.reduce((s, sh) => s + sh.rate, 0); const uniqueEmployees = [...new Set(ShiftsHistory.map(sh => sh.staffName))];
            let html = `<div class="topbar"><h1>Календарь смен</h1><div><span class="live-clock" id="liveClock"></span><button class="btn btn-yellow btn-sm" onclick="exportToExcel('shifts')"><i class="fas fa-file-excel"></i> Экспорт</button></div></div>
                <div class="summary"><div class="summary-card"><div class="sc-val">${totalShifts}</div><div class="sc-label">Всего смен</div></div><div class="summary-card"><div class="sc-val" style="color:#3fb950;">${totalEarned} ₽</div><div class="sc-label">Общая выручка</div></div><div class="summary-card"><div class="sc-val">${uniqueEmployees.length}</div><div class="sc-label">Сотрудников</div></div></div>
                <div style="display:flex; justify-content:space-between; margin-bottom:20px;"><button class="btn btn-outline btn-sm" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i> Предыдущий</button><h3 style="color:#a855f7;">${now.toLocaleString('ru', { month: 'long', year: 'numeric' })}</h3><button class="btn btn-outline btn-sm" onclick="changeMonth(1)">Следующий <i class="fas fa-chevron-right"></i></button></div>
                <div class="calendar-grid"><div class="calendar-day-header">Пн</div><div class="calendar-day-header">Вт</div><div class="calendar-day-header">Ср</div><div class="calendar-day-header">Чт</div><div class="calendar-day-header">Пт</div><div class="calendar-day-header">Сб</div><div class="calendar-day-header">Вс</div>`;
            for (let i = 0; i < startOffset; i++) html += `<div class="calendar-day empty"></div>`;
            const today = new Date().toISOString().slice(0,10);
            for (let day = 1; day <= daysInMonth; day++) { const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; const dayShifts = shiftsByDay[dateKey] || []; const isToday = dateKey === today; html += `<div class="calendar-day ${isToday ? 'today' : ''} ${dayShifts.length ? 'has-shifts' : ''}" onclick="showDayShifts('${dateKey}')"><div class="calendar-day-number">${day}</div>${dayShifts.length ? `<div class="calendar-shift-count">📅 ${dayShifts.length} смен</div>` : ''}<div class="calendar-shift-list">${dayShifts.slice(0,2).map(s => `<span>${s.staffName}</span>`).join('')}${dayShifts.length > 2 ? `<span>+${dayShifts.length-2}</span>` : ''}</div></div>`; }

                    <div class="table-wrap"><table class="users-table"><thead><tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Telegram</th><th>Должность</th><th>Действия</th></tr></thead><tbody>
                    ${Users.map(user => `<tr><td>${user.id}</td><td>${escapeHtml(user.name)}</td><td>${escapeHtml(user.phone || '—')}</td><td>${escapeHtml(user.tg || '—')}</td><td><span class="role-badge role-${user.role}">${getRoleName(user.role)}</span></td>
                    <td><button class="btn btn-red btn-sm" onclick="deleteUser(${user.id})"><i class="fas fa-trash"></i></button> <button class="btn btn-yellow btn-sm" onclick="resetUserPassword(${user.id})"><i class="fas fa-key"></i></button></td></tr>`).join('')}
                    </tbody></table></div></div>`;
            } else if (managerActiveTab === 'salary') {
                const currentDate = new Date(); const monthShifts = ShiftsHistory.filter(sh => new Date(sh.start).getMonth() === currentDate.getMonth());
                const usersWithSalary = Users.map(user => { const userShifts = monthShifts.filter(sh => sh.staffName === user.name); const userTasks = Tasks.filter(t => t.assignee === user.name); const salary = calculateSalary(user.id, userShifts, userTasks); return { ...user, salary, shifts: userShifts.length, tasks: userTasks.filter(t => t.status === 'done').length, hours: userShifts.reduce((s, sh) => s + Math.floor((new Date(sh.end) - new Date(sh.start)) / 3600000), 0) }; });
                const totalSalary = usersWithSalary.reduce((s, u) => s + u.salary, 0);
                container.innerHTML = `<div class="dev-card"><h3>Расчёт зарплаты за ${currentDate.toLocaleString('ru', { month: 'long', year: 'numeric' })}</h3>
                    <div class="salary-grid"><div class="salary-card"><h4>Общая статистика</h4><div class="salary-row"><span>Всего сотрудников:</span><span>${Users.length}</span></div>
                    <div class="salary-row"><span>Всего часов:</span><span>${usersWithSalary.reduce((s, u) => s + u.hours, 0)} ч</span></div>
                    <div class="salary-row"><span>Всего смен:</span><span>${monthShifts.length}</span></div>
                    <div class="salary-total">Общий ФОТ: ${totalSalary.toLocaleString()} ₽</div></div>
                    ${usersWithSalary.map(user => `<div class="salary-card"><h4><span class="role-badge role-${user.role}">${getRoleName(user.role)}</span> ${escapeHtml(user.name)}</h4>
                    <div class="salary-row"><span>Отработано часов:</span><span>${user.hours} ч</span></div>
                    <div class="salary-row"><span>Смен:</span><span>${user.shifts}</span></div>
                    <div class="salary-row"><span>Выполнено задач:</span><span>${user.tasks}</span></div>
                    <div class="salary-total">Итого: ${user.salary.toLocaleString()} ₽</div>
                    <button class="btn btn-outline btn-sm" onclick="editUserSalary(${user.id})">Настроить компоненты</button></div>`).join('')}</div>
                    <button class="btn btn-yellow btn-sm" onclick="exportSalaryToExcel()">Экспорт в Excel</button></div>`;
            } else if (managerActiveTab === 'settings') {
                container.innerHTML = `<div class="dev-card"><h3>Настройки зарплатных компонентов</h3><div class="salary-grid">
                    ${SALARY_COMPONENTS.map(comp => `<div class="salary-card"><h4>${comp.name}</h4><div class="salary-row"><span>Тип:</span><span>${comp.type === 'fixed' ? 'Фиксированный' : comp.type === 'hourly' ? 'Почасовой' : comp.type === 'per_shift' ? 'За смену' : comp.type === 'per_task' ? 'За задачу' : comp.type === 'kpi' ? 'KPI' : comp.type === 'percent' ? 'Процент' : 'Дополнительный'}</span></div>
                    <div class="salary-row"><span>Значение:</span><span>${comp.default} ${comp.unit}</span></div></div>`).join('')}
                    </div><p style="color:#8b949e;">ℹ️ Для каждого сотрудника можно настроить индивидуальные значения</p></div>`;
            }
        }
        function calculateSalary(userId, monthShifts, userTasks) {
            const settings = UserSalarySettings[userId] || {};
            const hoursWorked = monthShifts.reduce((s, sh) => s + Math.floor((new Date(sh.end) - new Date(sh.start)) / 3600000), 0);
            const shiftCount = monthShifts.length;
            const completedTasks = userTasks.filter(t => t.status === 'done').length;
            let total = 0;
            total += (settings.salaryBase || 50000);
            total += (settings.hourlyRate || 100) * hoursWorked;
            total += (settings.perShiftBonus || 50) * shiftCount;
            total += (settings.perTaskBonus || 20) * completedTasks;
            total += (settings.kpiBonus || 0);
            total += (settings.regionCoefficient || 0);
            total += (settings.seniorityBonus || 0);
            total += (settings.nightShiftBonus || 0);
            total += (settings.overtimeRate || 0) * Math.max(0, hoursWorked - 160);
            total += (settings.projectBonus || 0);
            return Math.round(total);
        }
        function editUserSalary(userId) {
            const user = Users.find(u => u.id === userId);
            const settings = UserSalarySettings[userId] || {};
            let html = `<div class="modal"><h3>Настройка зарплаты: ${user.name}</h3>${SALARY_COMPONENTS.map(comp => `<div class="form-group"><label>${comp.name} (${comp.unit})</label><input type="number" id="comp_${comp.name.replace(/\s/g, '_')}" value="${settings[comp.name.replace(/\s/g, '_')] || comp.default}"></div>`).join('')}
                <div class="btn-row"><button class="btn btn-outline" onclick="closeModal('modalEditSalary')">Отмена</button><button class="btn btn-purple" onclick="saveSalarySettings(${userId})">Сохранить</button></div></div>`;
            const overlay = document.createElement('div'); overlay.id = 'modalEditSalary'; overlay.className = 'modal-overlay'; overlay.innerHTML = html; document.body.appendChild(overlay); openModal('modalEditSalary');
        }
        function saveSalarySettings(userId) {
            const settings = {}; SALARY_COMPONENTS.forEach(comp => { const key = comp.name.replace(/\s/g, '_'); const input = document.getElementById(`comp_${key}`); if (input) settings[key] = parseFloat(input.value); });
            UserSalarySettings[userId] = settings; saveData(); closeModal('modalEditSalary'); renderManagerPanel(); showToast('✅ Настройки сохранены');
        }
        function exportSalaryToExcel() {
            const currentDate = new Date(); const monthShifts = ShiftsHistory.filter(sh => new Date(sh.start).getMonth() === currentDate.getMonth());
            const data = Users.map(user => { const userShifts = monthShifts.filter(sh => sh.staffName === user.name); const userTasks = Tasks.filter(t => t.assignee === user.name); const salary = calculateSalary(user.id, userShifts, userTasks); const hours = userShifts.reduce((s, sh) => s + Math.floor((new Date(sh.end) - new Date(sh.start)) / 3600000), 0); return { 'Сотрудник': user.name, 'Должность': getRoleName(user.role), 'Отработано часов': hours, 'Смен': userShifts.length, 'Выполнено задач': userTasks.filter(t => t.status === 'done').length, 'Итого зарплата': salary }; });
            const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, `Зарплата_${currentDate.toISOString().slice(0,10)}`); XLSX.writeFile(wb, `зарплата_${currentDate.toISOString().slice(0,10)}.xlsx`); showToast('✅ Экспорт завершен');
        }
        function addEmployee(name, phone, tg, role, password) { const newId = Users.length ? Math.max(...Users.map(u => u.id)) + 1 : 1; Users.push({ id: newId, name, phone, tg, role, password, tempPassword: true, createdAt: new Date().toISOString() }); saveData(); renderManagerPanel(); showToast(`✅ Сотрудник ${name} добавлен`); }
        function deleteUser(userId) { if (currentUser?.id === userId) { showToast('❌ Нельзя удалить себя'); return; } Users = Users.filter(u => u.id !== userId); saveData(); renderManagerPanel(); showToast('✅ Сотрудник удалён'); }
        function resetUserPassword(userId) { const user = Users.find(u => u.id === userId); if (user) { const newPass = prompt(`Новый пароль для ${user.name}:`, '1234'); if (newPass) { user.password = newPass; user.tempPassword = true; saveData(); showToast(`✅ Пароль изменён`); } } }

        // ПРОФИЛЬ
        function renderProfile() {
            if (!currentUser) return;
            let html = `<div class="topbar"><h1><i class="fas fa-user-circle"></i> Мой профиль</h1><div><span class="live-clock" id="liveClock"></span></div></div>
                <div class="profile-card"><div class="profile-field"><label>Имя</label><input type="text" value="${escapeHtml(currentUser.name)}" readonly disabled></div>
                <div class="profile-field"><label>Телефон</label><input type="text" value="${escapeHtml(currentUser.phone || '—')}" readonly disabled></div>
                <div class="profile-field"><label>Telegram</label><input type="text" value="${escapeHtml(currentUser.tg || '—')}" readonly disabled></div>
                <div class="profile-field"><label>Должность</label><input type="text" value="${getRoleName(currentUser.role)}" readonly disabled></div>
                ${currentUser.tempPassword ? '<div class="profile-field" style="color:#d2991d;"><i class="fas fa-exclamation-triangle"></i> У вас временный пароль! Рекомендуем сменить.</div>' : ''}
                <button class="btn btn-purple" onclick="openModal('modalChangePassword')"><i class="fas fa-key"></i> Сменить пароль</button></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }
        function changePassword(oldPass, newPass1, newPass2) {
            if (oldPass !== currentUser.password) return showToast('❌ Неверный текущий пароль');
            if (newPass1 !== newPass2) return showToast('❌ Пароли не совпадают');
            if (newPass1.length < 4) return showToast('❌ Минимум 4 символа');
            currentUser.password = newPass1; currentUser.tempPassword = false;
            const userIndex = Users.findIndex(u => u.id === currentUser.id);
            if (userIndex !== -1) { Users[userIndex].password = newPass1; Users[userIndex].tempPassword = false; }
            saveData(); closeModal('modalChangePassword'); showToast('✅ Пароль изменён!');
        }

        // ============ НАВИГАЦИЯ ============
        let pendingTab = null;
        function checkPassword(tab, callback) { if (!PROTECTED_TABS.includes(tab)) { callback(true); return; } pendingTab = tab; window._pwdCallback = callback; openModal('modalPassword'); }
        function submitPassword() { const input = document.getElementById('passwordInput').value; if (input === PASSWORD) { closeModal('modalPassword'); document.getElementById('passwordInput').value = ''; document.getElementById('passwordError').classList.add('hidden'); if (window._pwdCallback) window._pwdCallback(true); if (pendingTab) switchTab(pendingTab); pendingTab = null; } else { document.getElementById('passwordError').classList.remove('hidden'); } }
        function switchTab(tab) { if (PROTECTED_TABS.includes(tab) && currentTab !== tab) { checkPassword(tab, (ok) => { if (ok) { currentTab = tab; render(); updateNav(); } }); return; } currentTab = tab; render(); updateNav(); }
        function updateNav() { document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); const item = document.querySelector(`[data-tab="${currentTab}"]`); if (item) item.classList.add('active'); }
        function updateBadge() { const cnt = Issues.list.filter(i => i.status !== 'done' && i.status !== 'cantfix').length; const badge = document.getElementById('badgeIssues'); if (badge) { badge.textContent = cnt; badge.style.display = cnt > 0 ? 'inline' : 'none'; } }
        function updateClock() { const el = document.getElementById('liveClock'); if (el) el.textContent = new Date().toLocaleTimeString(); }
        function render() { if (currentTab === 'dashboard') renderDashboard(); else if (currentTab === 'tasks') renderTasks(); else if (currentTab === 'vr_games') renderVRGames(); else if (currentTab === 'shift') renderShift(); else if (currentTab === 'calendar_history') renderCalendarAndHistory(); else if (currentTab === 'helmets') renderHelmets(); else if (currentTab === 'issues') renderIssues(); else if (currentTab === 'moves') renderMoves(); else if (currentTab === 'manager') renderManagerPanel(); else if (currentTab === 'profile') renderProfile(); updateBadge(); updateClock(); fillSelects(); }

        // ============ МЕНЮ ============
        function buildSidebar() {
            let menuHtml = `<div class="logo"><i class="fas fa-vr-cardboard"></i><span>VR HOUSE</span></div>
                <div class="nav-label">Основное</div>
                <div class="nav-item" data-tab="dashboard"><i class="fas fa-th-large"></i> Мониторинг</div>
                <div class="nav-item" data-tab="vr_games"><i class="fas fa-gamepad"></i> VR-игры</div>
                <div class="nav-item" data-tab="tasks"><i class="fas fa-tasks"></i> Задачи</div>
                <div class="nav-label">Сотрудник</div>
                <div class="nav-item" data-tab="shift"><i class="fas fa-user-clock"></i> Моя смена <i class="fas fa-lock lock-icon"></i></div>
                <div class="nav-item" data-tab="profile"><i class="fas fa-user-circle"></i> Мой профиль</div>
                <div class="nav-label">Оборудование</div>
                <div class="nav-item" data-tab="helmets"><i class="fas fa-clipboard-list"></i> Список</div>
                <div class="nav-item" data-tab="moves"><i class="fas fa-truck"></i> Перемещения</div>
                <div class="nav-item" data-tab="issues"><i class="fas fa-exclamation-triangle"></i> Проблемы <span class="nav-badge" id="badgeIssues">0</span></div>
                <div class="nav-label">Система</div>
                <div class="nav-item" data-tab="calendar_history"><i class="fas fa-calendar-alt"></i> Календарь смен <i class="fas fa-lock lock-icon"></i></div>`;
            if (currentUser?.role === 'director' || currentUser?.role === 'manager') {
                menuHtml += `<div class="nav-label">Управление</div>
                <div class="nav-item" data-tab="manager"><i class="fas fa-chalkboard-user"></i> Панель управляющего</div>`;
            }
            document.getElementById('sidebar').innerHTML = menuHtml;
            document.querySelectorAll('.nav-item').forEach(el => { el.addEventListener('click', () => { const tab = el.dataset.tab; if (tab) switchTab(tab); }); });
        }

        // ============ ИНИЦИАЛИЗАЦИЯ ============
        function initModals() {
            document.getElementById('btnSubmitTask')?.addEventListener('click', () => { const title = document.getElementById('taskTitle').value.trim(); if (!title) return alert('Введите название'); addTask(title, document.getElementById('taskDesc').value, document.getElementById('taskDateFrom').value, document.getElementById('taskDateTo').value, document.getElementById('taskAssignee').value, document.getElementById('taskPriority').value); closeModal('modalTask'); });
            document.getElementById('btnCancelTask')?.addEventListener('click', () => closeModal('modalTask'));
            document.getElementById('btnSubmitGame')?.addEventListener('click', addGameToHelmet);
            document.getElementById('btnCancelGame')?.addEventListener('click', () => closeModal('modalAddGame'));
            document.getElementById('btnSubmitReject')?.addEventListener('click', submitReject);
            document.getElementById('btnCancelReject')?.addEventListener('click', () => closeModal('modalRejectReason'));
            document.getElementById('btnStartShift')?.addEventListener('click', () => { startShift(document.getElementById('inputStaffName').value); closeModal('modalShiftStart'); });
            document.getElementById('btnCancelShift')?.addEventListener('click', () => closeModal('modalShiftStart'));
            document.getElementById('btnConfirmShiftEnd')?.addEventListener('click', () => { endShift(); closeModal('modalShiftEnd'); });
            document.getElementById('btnCancelShiftEnd')?.addEventListener('click', () => closeModal('modalShiftEnd'));
            document.getElementById('btnSubmitIssue')?.addEventListener('click', () => { const sel = document.getElementById('selectIssueEquipment'); if (sel) reportIssue(sel.value, document.getElementById('selectIssueType').value, document.getElementById('inputIssueDesc').value, document.getElementById('selectIssuePriority').value); closeModal('modalReportIssue'); document.getElementById('inputIssueDesc').value = ''; document.getElementById('issueImage').value = ''; });
            document.getElementById('btnCancelIssue')?.addEventListener('click', () => closeModal('modalReportIssue'));
            document.getElementById('btnSubmitMove')?.addEventListener('click', submitMultiMove);
            document.getElementById('btnCancelMove')?.addEventListener('click', () => closeModal('modalMoveEquipment'));
            document.getElementById('btnSubmitPassword')?.addEventListener('click', submitPassword);
            document.getElementById('btnCancelPassword')?.addEventListener('click', () => closeModal('modalPassword'));
            document.getElementById('btnCloseImage')?.addEventListener('click', () => closeModal('modalImageView'));
            document.getElementById('issueImage')?.addEventListener('change', handleImageUpload);
            document.getElementById('btnSubmitEmp')?.addEventListener('click', () => { const name = document.getElementById('empName').value.trim(); if (!name) return alert('Введите имя'); addEmployee(name, document.getElementById('empPhone').value, document.getElementById('empTg').value, document.getElementById('empRole').value, document.getElementById('empPassword').value); closeModal('modalAddEmployee'); });
            document.getElementById('btnCancelEmp')?.addEventListener('click', () => closeModal('modalAddEmployee'));
            document.getElementById('btnSubmitPass')?.addEventListener('click', () => { changePassword(document.getElementById('oldPass').value, document.getElementById('newPass1').value, document.getElementById('newPass2').value); closeModal('modalChangePassword'); });
            document.getElementById('btnCancelPass')?.addEventListener('click', () => closeModal('modalChangePassword'));
        }

        function initApp() { loadData(); initModals(); switchTab('dashboard'); setInterval(() => { if (Shift.active && (currentTab === 'dashboard' || currentTab === 'shift')) render(); }, 60000); setInterval(updateClock, 1000); 
            window.completeTask = completeTask; window.openRejectModal = openRejectModal; window.changeIssueStatus = changeIssueStatus; 
            window.returnMultiEquipment = returnMultiEquipment; window.endShift = endShift; window.openModal = openModal; 
            window.exportToExcel = exportToExcel; window.exportToPDF = exportToPDF; window.viewImage = viewImage; 
            window.openAddGameModal = openAddGameModal; window.removeGameFromHelmet = removeGameFromHelmet; window.toggleHelmetGames = toggleHelmetGames; 
            window.changeMonth = changeMonth; window.showDayShifts = showDayShifts; window.openMoveModal = openMoveModal; 
            window.toggleEquipmentSelection = toggleEquipmentSelection; window.setManagerTab = setManagerTab; 
            window.editUserSalary = editUserSalary; window.deleteUser = deleteUser; window.resetUserPassword = resetUserPassword; 
            window.saveSalarySettings = saveSalarySettings; window.exportSalaryToExcel = exportSalaryToExcel; window.logout = () => { currentUser = null; location.reload(); };
            window.addGameToHelmetById = addGameToHelmetById;
        }
    </script>
</body>
</html>
