<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏ Шахтёр-Мир — Копай и богатей!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Загрузка -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <h1>⛏ Шахтёр-Мир</h1>
            <div class="loading-bar"><div class="loading-progress"></div></div>
            <p>Спускаемся в шахту...</p>
        </div>
    </div>

    <!-- Игра -->
    <div id="game-container" class="game-container hidden">

        <!-- Верхняя панель ресурсов -->
        <header class="top-bar">
            <div class="resources">
                <span class="res-item stone">🪨<span id="stone">0</span></span>
                <span class="res-item iron">🔩<span id="iron">0</span></span>
                <span class="res-item gold">🥇<span id="gold">0</span></span>
                <span class="res-item diamond">💎<span id="diamond">0</span></span>
                <span class="res-item oil">🛢<span id="oil">0</span></span>
                <span class="res-item coins">🪙<span id="coins">100</span></span>
            </div>
            <div class="level-info">
                ⭐ Уровень: <span id="level">1</span>
            </div>
        </header>

        <main class="main-area">
            
            <!-- Шахта -->
            <section id="mine-view" class="view active">
                <div class="mine-scene">
                    
                    <!-- Анимация -->
                    <div class="mine-cartoon">
                        <div class="miner-icon" id="miner-icon">⛏️</div>
                        <div class="oil-pump" id="oil-pump">🛢️</div>
                        <div class="ore-pop" id="ore-pop"></div>
                    </div>
                    
                    <!-- Кнопка копать -->
                    <button id="mine-btn" class="mine-btn">⛏️ КОПАТЬ!</button>
                    
                    <!-- Прогресс -->
                    <div class="progress-bar">
                        <div class="progress-fill" id="ore-progress"></div>
                    </div>
                    <p id="current-ore-text">🪨 Камень</p>
                    
                    <!-- Статы -->
                    <div class="stats-row">
                        <div>👷 Шахтёры: <b id="miners-count">1</b></div>
                        <div>⚡ Сила: <b id="click-power">1</b></div>
                        <div>⛏ Авто-руда: <b id="auto-power">0</b>/сек</div>
                    </div>
                    
                    <!-- Нефтянка -->
                    <div class="oil-section">
                        <h3>🛢 Нефтяная вышка</h3>
                        <div class="stats-row">
                            <div>🏭 Вышек: <b id="oil-rigs-count">0</b></div>
                            <div>🛢 Бочек: <b id="barrels-count">0</b></div>
                            <div>⏱ Добыча: <b id="oil-auto">0</b>/сек</div>
                        </div>
                        <button id="collect-oil-btn" class="oil-btn">🛢 Собрать нефть (<span id="oil-ready">0</span>)</button>
                    </div>

                    <!-- Кнопка продажи -->
                    <button id="sell-all-btn" class="sell-btn">💰 ПРОДАТЬ ВСЁ</button>
                </div>
            </section>

            <!-- Магазин -->
            <section id="shop-view" class="view hidden">
                <h2>🛒 Магазин</h2>
                <div class="shop-tabs">
                    <button class="stab active" data-tab="miners">👷 Шахтёры</button>
                    <button class="stab" data-tab="pickaxes">🧰 Кирки</button>
                    <button class="stab" data-tab="oilrigs">🏭 Вышки</button>
                    <button class="stab" data-tab="barrels">🛢 Бочки</button>
                    <button class="stab" data-tab="cases">📦 Кейсы</button>
                    <button class="stab" data-tab="boosts">🔥 Бусты</button>
                </div>
                <div id="shop-content" class="shop-grid"></div>
            </section>

            <!-- Инвентарь -->
            <section id="inventory-view" class="view hidden">
                <h2>🎒 Инвентарь</h2>
                <div id="inventory-content" class="inv-grid">
                    <p style="color:#888;">Пока пусто</p>
                </div>
            </section>

            <!-- Достижения -->
            <section id="achievements-view" class="view hidden">
                <h2>🏆 Достижения</h2>
                <div id="achievements-content"></div>
            </section>

        </main>

        <!-- Нижнее меню -->
        <footer class="bottom-bar">
            <button class="nav-btn active" data-view="mine">⛏ Шахта</button>
            <button class="nav-btn" data-view="shop">🛒 Магазин</button>
            <button class="nav-btn" data-view="inventory">🎒 Инвентарь</button>
            <button class="nav-btn" data-view="achievements">🏆 Ачивки</button>
        </footer>

    </div>

    <!-- Модалка кейса -->
    <div id="case-modal" class="modal hidden">
        <div class="modal-content case-open">
            <h2>📦 Открытие кейса!</h2>
            <div id="case-result"></div>
            <button id="case-close-btn" class="action-btn">🎁 Забрать!</button>
        </div>
    </div>

    <!-- Модалка ачивки -->
    <div id="achieve-popup" class="achieve-popup hidden">
        <div class="achieve-popup-content">
            <span class="achieve-icon">🏆</span>
            <div>
                <strong id="achieve-name">Достижение!</strong>
                <p id="achieve-desc">Описание</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
